# dashboards.yml
# Tells Grafana to auto-load any dashboard JSON files placed in
# monitoring/grafana/dashboards/ on startup.
# Place at: monitoring/grafana/provisioning/dashboards/dashboards.yml

apiVersion: 1

providers:
  - name: "Dynamic Pricing Engine"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards